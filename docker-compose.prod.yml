# Production stack. It runs the image CI published to Docker Hub instead of
# building from source. The deploy job copies this file to the server as
# docker-compose.yml, and scripts/deploy.sh supplies the variables below.
name: devops-screening-task

services:
  app:
    image: ${IMAGE_REPO:?set IMAGE_REPO, e.g. docker.io/user/devops-screening-task}:${IMAGE_TAG:?set IMAGE_TAG, e.g. sha-abc1234}
    ports:
      - "${HOST_PORT:-80}:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    # Same hardening as the local compose file.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
    # Docker keeps container logs without a size limit by default. On a small
    # server that eventually fills the disk, so rotate them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
