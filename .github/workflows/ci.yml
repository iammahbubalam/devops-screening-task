name: CI

# Pushes to main run every job and publish the image.
# Pull requests run the same checks but never publish.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer commit on the same pull request cancels the older run.
# Runs on main are never cancelled, so every merge gets an image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: devops-screening-task

# Third-party actions are pinned to a full commit SHA, because a tag can be
# moved to different code. Dependabot keeps the SHAs current.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Lint Go code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: app

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          scripts/system_health.sh scripts/smoke_test.sh scripts/deploy.sh

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Run tests
        working-directory: app
        run: go test -race -cover ./...

  build:
    name: Build, smoke test and scan
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single-platform build loaded into the local Docker engine so the next
      # steps can run and scan it. Nothing is pushed here.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: ./scripts/smoke_test.sh "${IMAGE_NAME}:ci"

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish to Docker Hub
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only this job gets the Docker Hub token, and only on main.
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" follows main. "sha-<commit>" never changes, so a deploy can
      # pin it and a rollback means redeploying the previous one.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # amd64 for most servers, arm64 for AWS Graviton and Apple Silicon.
      # The build layers come from the cache the build job just filled.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # Optional. Runs only when the repository variable DEPLOY_ENABLED is "true",
  # so without a server the job is skipped and the pipeline above stays green.
  deploy:
    name: Deploy to VPS
    needs: publish
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Shows up under "Deployments" on GitHub with the commit that went live.
    environment: production
    # Two deploys must never overlap, and a running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_DIR: devops-screening-task # relative to the deploy user's home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # known_hosts pins the server's host key, so the job fails instead of
      # talking to an impostor. Without it, ssh would trust whoever answers.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Deploys the immutable sha- tag that publish just pushed, never
      # "latest", so the server always runs a known commit.
      - name: Deploy over SSH
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          IMAGE_REPO: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o "Port=${SSH_PORT}")

          # SC2029: these values are meant to be filled in here, on the runner,
          # before ssh sends the command. deploy.sh validates them again.
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$SSH_TARGET" "mkdir -p '$APP_DIR'"
          scp "${opts[@]}" docker-compose.prod.yml "$SSH_TARGET:$APP_DIR/docker-compose.yml"
          scp "${opts[@]}" scripts/deploy.sh "$SSH_TARGET:$APP_DIR/deploy.sh"
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$SSH_TARGET" \
            "IMAGE_REPO='$IMAGE_REPO' IMAGE_TAG='$IMAGE_TAG' bash '$APP_DIR/deploy.sh'"
